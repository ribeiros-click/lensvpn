name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Testes do motor
        run: python3 -I tests/test_engine.py

      - name: Compilar app e DMG
        run: OVPNBar/build.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OVPNBar-dmg
          path: OVPNBar/build/*.dmg
          if-no-files-found: error

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" OVPNBar/build/*.dmg --clobber
